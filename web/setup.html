<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Viral Shorts</title>
<style>
  /* Mismo aspecto que la aplicacion: marco oscuro y panel blanco redondeado. */
  :root {
    --frame: #1b1c20; --surf: #ffffff; --raise: #f3f5f9; --line: #e4e7ee;
    --text: #16171b; --mute: #5f6573; --faint: #8f95a3;
    --ink: #16171b; --ink-text: #ffffff; --sky: #dcebfb;
    --bad: #d23c3c; --bad-soft: #fdecec;
    --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --frame: #0f1013; --surf: #1f2127; --raise: #272a31; --line: #333740;
      --text: #f1f2f5; --mute: #a6abb6; --faint: #7c818c;
      --ink: #f1f2f5; --ink-text: #16171b; --sky: #1f3043;
      --bad: #ff7272; --bad-soft: #3a2224;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--frame); color: var(--text);
    font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 24px;
  }
  main {
    width: min(480px, 100%);
    background: var(--surf);
    border-radius: 30px; padding: 36px 36px 28px;
  }
  .logo { width: 56px; height: 56px; display: block; margin-bottom: 24px; border-radius: 16px; }
  h1 { font: 700 26px/1.15 var(--display); letter-spacing: -.01em; margin: 0 0 8px; }
  p { color: var(--mute); margin: 0 0 26px; }
  .meter { padding: 16px 18px; border-radius: 18px; background: var(--sky); }
  .bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.7); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 8px; background: var(--ink); transition: width .4s ease; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 10px; }
  .step { font-weight: 600; min-height: 1.5em; }
  .pct { font: 700 22px var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .error {
    margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: var(--bad-soft);
    color: var(--bad); font-size: 13px; white-space: pre-wrap; word-break: break-word;
  }
  button {
    margin-top: 18px; padding: 11px 22px; border: 0; border-radius: 99px;
    background: var(--ink); color: var(--ink-text); font: 600 14px var(--ui); cursor: pointer;
  }
  button:hover { opacity: .88; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  small { display: block; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="18" fill="#f6e9c3"/>
    <rect x="19" y="13" width="23" height="39" rx="7" fill="#16171b"/>
    <path d="M27 25.5v14l10.5-7z" fill="#f6e9c3"/>
    <path d="M48 9.5l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#16171b"/>
  </svg>
  <h1>Preparando Viral Shorts</h1>
  <p>Es la primera vez que se abre: se descargan las herramientas que usa el programa. Solo ocurre una vez y no se instala nada fuera de su carpeta.</p>
  <div class="meter">
    <div class="row"><span class="step" id="step">Empezando…</span><span class="pct" id="pct"></span></div>
    <div class="bar"><i id="fill"></i></div>
  </div>
  <div class="error" id="error" hidden></div>
  <button id="retry" hidden>Reintentar</button>
  <small>Necesita conexión a internet. Se descargan unos 120 MB.</small>
</main>
<script>
const TOKEN = "__TOKEN__";
const AUTH = { "X-VS-Token": TOKEN };
const $ = id => document.getElementById(id);

async function call(path, body) {
  const options = body === undefined ? { headers: AUTH } : { method: "POST", headers: { ...AUTH, "Content-Type": "application/json" }, body: JSON.stringify(body) };
  return (await fetch(path, options)).json();
}

let started = false;
async function tick() {
  let state;
  try { state = await call("/api/setup"); } catch (e) { setTimeout(tick, 1000); return; }

  if (state.done) { $("fill").style.width = "100%"; $("pct").textContent = "100 %"; $("step").textContent = "Listo"; location.reload(); return; }
  if (state.error) {
    $("error").hidden = false;
    $("error").textContent = state.error;
    $("step").textContent = "No se ha podido terminar";
    $("retry").hidden = false;
    return;
  }
  if (!state.running && !started) {
    started = true;
    await call("/api/setup/start", {});
  }
  const pct = Math.round((state.overall || 0) * 100);
  $("fill").style.width = pct + "%";
  $("pct").textContent = pct ? pct + " %" : "";
  if (state.step) $("step").textContent = state.step;
  setTimeout(tick, 500);
}

$("retry").addEventListener("click", async () => {
  $("error").hidden = true;
  $("retry").hidden = true;
  $("step").textContent = "Reintentando…";
  await call("/api/setup/start", {});
  setTimeout(tick, 800);
});
tick();
</script>
</body>
</html>

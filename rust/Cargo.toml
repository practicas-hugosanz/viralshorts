[package]
name = "viralshorts"
version = "1.4.0"
edition = "2021"
description = "De un podcast de YouTube a shorts verticales subtitulados"
default-run = "viralshorts"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha1 = "0.10"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
thiserror = "2"
regex = "1.13.1"
ort = "2.0.0-rc.15"
ndarray = "0.17.2"
rfd = "0.17.2"
ctrlc = "3.5.2"
getrandom = "0.4.3"
wry = "0.57.0"
tao = "0.37.1"
zip = "9.0.5"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"
